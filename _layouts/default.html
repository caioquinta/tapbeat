<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<style>
  :root { --bg: #fff; --text: #1d1b26; --muted: #5d5a6b; --accent: #007a8a; --rule: #e4e2ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0d1a; --text: #ecebf2; --muted: #a6a4b5; --accent: #00e5ff; --rule: #2a2738; }
  }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 1.2rem; margin: 2em 0 0.5em; padding-top: 1em; border-top: 1px solid var(--rule); }
  a { color: var(--accent); }
  em { color: var(--muted); }
  ul { padding-left: 1.3em; }
  li { margin: 0.3em 0; }
</style>
</head>
<body>
<main>
{{ content }}
</main>
</body>
</html>
